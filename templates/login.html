{% extends 'base.html' %}
{% block title %}Sign In - Artchelo Design{% endblock %}

{% block content_public %}
<div class="max-w-md mx-auto mt-16 bg-white p-8 rounded-lg shadow">
    <div class="flex items-center gap-3 mb-6">
        <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">A</div>
        <div>
            <h1 class="text-xl font-bold text-slate-800">Artchelo Design</h1>
            <p class="text-xs text-slate-500">Business Hub — Sign In</p>
        </div>
    </div>
    <form method="POST" autocomplete="on" class="space-y-4">
        <div>
            <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
            <input type="text" name="username" id="username" required autofocus
                   autocomplete="username"
                   class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
            <div class="relative">
                <input type="password" name="password" id="password" required
                       autocomplete="current-password"
                       class="w-full border border-slate-300 rounded px-3 py-2 pr-10 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <button type="button" id="togglePassword"
                        class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600"
                        aria-label="Show password" aria-pressed="false">
                    <i class="fa-solid fa-eye" id="togglePasswordIcon" aria-hidden="true"></i>
                </button>
            </div>
        </div>
        <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" name="remember" value="on"
                       class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-2 focus:ring-blue-500">
                <span class="text-sm text-slate-700">Remember me for 30 days</span>
            </label>
        </div>
        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-medium">
            Sign In
        </button>
    </form>
    <div class="mt-6 border-t border-slate-200 pt-4">
        <div class="flex items-start gap-3">
            <i class="fa-solid fa-lock text-slate-400 mt-1"></i>
            <div>
                <p class="font-semibold text-slate-700 text-sm">Forgot your password?</p>
                <p class="text-sm text-slate-500 mt-1">Please contact your administrator for assistance.</p>
            </div>
        </div>
    </div>
</div>
<script>
(function() {
    const toggle = document.getElementById('togglePassword');
    const icon = document.getElementById('togglePasswordIcon');
    const field = document.getElementById('password');
    if (!toggle || !field || !icon) return;

    toggle.addEventListener('click', function() {
        const show = field.type === 'password';
        field.type = show ? 'text' : 'password';
        icon.classList.toggle('fa-eye', !show);
        icon.classList.toggle('fa-eye-slash', show);
        toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        toggle.setAttribute('aria-pressed', show ? 'true' : 'false');
    });
})();
</script>
{% endblock %}
