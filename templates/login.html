{% extends 'base.html' %}
{% block title %}Sign In - Artchelo Design{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16 bg-white p-8 rounded-lg shadow">
    <div class="flex items-center gap-3 mb-6">
        <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">A</div>
        <div>
            <h1 class="text-xl font-bold text-slate-800">Artchelo Design</h1>
            <p class="text-xs text-slate-500">Business Hub — Sign In</p>
        </div>
    </div>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
            <input type="text" name="username" required
                   class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
            <input type="password" name="password" required
                   class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-medium">
            Sign In
        </button>
    </form>
    <div class="mt-6 text-xs text-slate-500 border-t pt-4">
        <p class="font-semibold mb-1">Demo credentials:</p>
        <p>Admin: <code>admin</code> / <code>admin123</code></p>
        <p>Employee: <code>jdoe</code> / <code>employee123</code></p>
    </div>
</div>
{% endblock %}
