{% extends 'base.html' %}
{% block title %}{% if is_new %}New{% else %}Edit{% endif %} Client{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-slate-800">
        {% if is_new %}New Client{% else %}Edit Client{% endif %}
    </h1>
    <a href="{{ url_for('sales_clients') }}" class="text-sm text-slate-600 hover:underline">← Back</a>
</div>

<div class="bg-white rounded-lg shadow p-6 max-w-xl">
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
                Name <span class="text-red-600">*</span>
            </label>
            <input type="text" name="name" required
                   value="{{ client.name if client else '' }}"
                   class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Client Type</label>
            <select name="client_type"
                    class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                {% for t in ['author','company','other'] %}
                <option value="{{ t }}" {% if client and client.client_type == t %}selected{% elif not client and t == 'author' %}selected{% endif %}>{{ t|capitalize }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" name="email"
                       value="{{ client.email if client else '' }}"
                       class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Phone</label>
                <input type="text" name="phone"
                       value="{{ client.phone if client else '' }}"
                       class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Notes</label>
            <textarea name="notes" rows="3"
                      class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">{{ client.notes if client else '' }}</textarea>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded font-medium">
                {% if is_new %}Create Client{% else %}Save Changes{% endif %}
            </button>
            <a href="{{ url_for('sales_clients') }}"
               class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-5 py-2 rounded font-medium">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
