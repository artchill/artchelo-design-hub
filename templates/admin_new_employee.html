{% extends 'base.html' %}
{% block title %}Add Employee - Admin{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-slate-800">Add New Employee</h1>
    <a href="{{ url_for('admin_employees') }}"
       class="text-sm text-slate-600 hover:text-slate-800">← Back to Team</a>
</div>

<div class="bg-white rounded-lg shadow p-6 max-w-2xl">
    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wide">Personal Info</h2>
        <div class="grid grid-cols-12 gap-4">
            <div class="col-span-5">
                <label class="block text-sm font-medium text-slate-700 mb-1">First Name <span class="text-red-600">*</span></label>
                <input type="text" name="fname" required value="{{ form_data.fname or '' }}"
                       class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div class="col-span-2">
                <label class="block text-sm font-medium text-slate-700 mb-1">M.I.</label>
                <input type="text" name="mname" maxlength="2" value="{{ form_data.mname or '' }}"
                       placeholder="L"
                       class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none text-center uppercase">
            </div>
            <div class="col-span-5">
                <label class="block text-sm font-medium text-slate-700 mb-1">Last Name <span class="text-red-600">*</span></label>
                <input type="text" name="lname" required value="{{ form_data.lname or '' }}"
                       class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Birthdate <span class="text-red-600">*</span></label>
                <input type="date" name="birthdate" required value="{{ form_data.birthdate or '' }}"
                       class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Date Hired <span class="text-red-600">*</span></label>
                <input type="date" name="date_hired" required value="{{ form_data.date_hired or '' }}"
                       class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Codename</label>
                <input type="text" name="codename" maxlength="30" value="{{ form_data.codename or '' }}"
                       placeholder="e.g. chelo"
                       class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email <span class="text-red-600">*</span></label>
                <input type="email" name="email" required value="{{ form_data.email or '' }}"
                       placeholder="e.g. name@example.com"
                       class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Gender <span class="text-red-600">*</span></label>
                <select name="gender" required
                        class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                    <option value="">— Select —</option>
                    <option value="male" {% if form_data.gender == 'male' %}selected{% endif %}>Male</option>
                    <option value="female" {% if form_data.gender == 'female' %}selected{% endif %}>Female</option>
                    <option value="prefer_not_to_say" {% if form_data.gender == 'prefer_not_to_say' %}selected{% endif %}>Prefer not to say</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Profile Picture</label>
                <input type="file" name="profile_pic" accept="image/jpeg,image/png,image/webp"
                       class="w-full text-sm border border-slate-300 rounded px-3 py-1.5 bg-white file:mr-3 file:border-0 file:bg-slate-100 file:px-3 file:py-1 file:rounded file:text-slate-700">
                <p class="text-xs text-slate-500 mt-1">Max 2MB, JPG/PNG/WEBP</p>
            </div>
        </div>

        <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wide pt-2">Account Info</h2>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Username <span class="text-red-600">*</span></label>
            <input type="text" name="username" required value="{{ form_data.username or '' }}"
                   placeholder="e.g. jdoe"
                   class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Role <span class="text-red-600">*</span></label>
            <select name="role" required
                    class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                <option value="">— Select role —</option>
                <option value="employee" {% if form_data.role == 'employee' %}selected{% endif %}>Employee</option>
                <option value="admin" {% if form_data.role == 'admin' %}selected{% endif %}>Admin</option>
                {% if current_user.is_super_admin %}
                <option value="super-admin" {% if form_data.role == 'super-admin' %}selected{% endif %}>Super-admin</option>
                {% endif %}
            </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password <span class="text-red-600">*</span></label>
                <input type="password" name="password" required minlength="6" placeholder="At least 6 chars"
                       class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Confirm Password <span class="text-red-600">*</span></label>
                <input type="password" name="confirm_password" required minlength="6"
                       class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
        </div>

        <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wide pt-2">Job Info</h2>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Job Position <span class="text-red-600">*</span></label>
                <input type="text" name="job_position" required value="{{ form_data.job_position or '' }}"
                       placeholder="e.g. Web Developer"
                       class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Employee Type <span class="text-red-600">*</span></label>
                <select name="employee_type" required
                        class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                    <option value="">— Select —</option>
                    <option value="full-time" {% if form_data.employee_type == 'full-time' %}selected{% endif %}>Full-time</option>
                    <option value="part-time" {% if form_data.employee_type == 'part-time' %}selected{% endif %}>Part-time</option>
                    <option value="outsourced" {% if form_data.employee_type == 'outsourced' %}selected{% endif %}>Outsourced</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Monthly Salary (₱) <span class="text-red-600">*</span></label>
            <input type="number" name="monthly_salary" step="0.01" min="0" required
                   value="{{ form_data.monthly_salary or '' }}" placeholder="e.g. 25000"
                   class="w-full md:w-1/2 border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded font-medium">
                Create User
            </button>
            <a href="{{ url_for('admin_employees') }}"
               class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-5 py-2 rounded font-medium">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
